<header class="site-header">
    <div class="container site-header__bar">
        <a href="#home" class="site-header__brand">
            {% if header.logo %}
                <img src="{{ header.logo.url }}" alt="{{ header.brand_name }}" class="site-header__logo-lockup">
            {% else %}
                <span class="site-header__logo-fallback">SJR</span>
                <span class="site-header__divider"></span>
                <span>
                    <span class="site-header__brand-name" style="display:block;">{{ header.brand_name }}</span>
                    {% if header.tagline %}
                        <span class="site-header__tagline">{{ header.tagline }}</span>
                    {% endif %}
                </span>
            {% endif %}
        </a>

        <nav class="site-header__nav">
            {% for item in header.nav_items.all %}
                <a href="{{ item.link }}">{{ item.label }}</a>
            {% endfor %}
        </nav>

        {% if header.cta_text %}
            <a href="{{ header.cta_link }}" class="btn btn-gold site-header__cta">{{ header.cta_text }}</a>
        {% endif %}

        <button class="site-header__toggle" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>
</header>
