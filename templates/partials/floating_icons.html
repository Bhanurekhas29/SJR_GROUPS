{% load text_extras %}
{% if floating_whatsapp or floating_call %}
<div class="floating-icons">
    {% if floating_whatsapp %}
        <a href="https://wa.me/{{ floating_whatsapp }}" target="_blank" rel="noopener" class="floating-icon floating-icon--whatsapp" aria-label="Chat on WhatsApp">
            {{ 'whatsapp'|social_icon }}
        </a>
    {% endif %}
    {% if floating_call %}
        <a href="tel:+{{ floating_call }}" class="floating-icon floating-icon--call" aria-label="Call us">
            <span class="floating-icon__ring"></span>
            <span class="floating-icon__ring floating-icon__ring--delay"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.4 2.1L8 9.9a16 16 0 0 0 6 6l1.4-1.4a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>
            </svg>
        </a>
    {% endif %}
</div>
{% endif %}
