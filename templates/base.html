{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SJR Groups{% endblock %}</title>

    <link rel="icon" href="{% static 'favicon.ico' %}" sizes="any">
    <link rel="icon" type="image/png" href="{% static 'favicon-32.png' %}" sizes="32x32">
    <link rel="icon" type="image/png" href="{% static 'favicon-16.png' %}" sizes="16x16">
    <link rel="apple-touch-icon" href="{% static 'favicon.png' %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/base.css' %}?v={% now 'U' %}">
    <link rel="stylesheet" href="{% static 'css/header.css' %}?v={% now 'U' %}">
    <link rel="stylesheet" href="{% static 'css/hero.css' %}?v={% now 'U' %}">
    <link rel="stylesheet" href="{% static 'css/about.css' %}?v={% now 'U' %}">
    <link rel="stylesheet" href="{% static 'css/vision_mission.css' %}?v={% now 'U' %}">
    <link rel="stylesheet" href="{% static 'css/businesses.css' %}?v={% now 'U' %}">
    <link rel="stylesheet" href="{% static 'css/standard.css' %}?v={% now 'U' %}">
    <link rel="stylesheet" href="{% static 'css/videos.css' %}?v={% now 'U' %}">
    <link rel="stylesheet" href="{% static 'css/gallery.css' %}?v={% now 'U' %}">
    <link rel="stylesheet" href="{% static 'css/reviews.css' %}?v={% now 'U' %}">
    <link rel="stylesheet" href="{% static 'css/social.css' %}?v={% now 'U' %}">
    <link rel="stylesheet" href="{% static 'css/faq.css' %}?v={% now 'U' %}">
    <link rel="stylesheet" href="{% static 'css/contact.css' %}?v={% now 'U' %}">
    <link rel="stylesheet" href="{% static 'css/cta_banner.css' %}?v={% now 'U' %}">
    <link rel="stylesheet" href="{% static 'css/footer.css' %}?v={% now 'U' %}">
    <link rel="stylesheet" href="{% static 'css/floating_icons.css' %}?v={% now 'U' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include 'partials/header.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include 'partials/footer.html' %}
    {% include 'partials/floating_icons.html' %}

    {% block extra_js %}{% endblock %}
    <script src="{% static 'js/header.js' %}?v={% now 'U' %}"></script>
    <script src="{% static 'js/hero.js' %}?v={% now 'U' %}"></script>
    <script src="{% static 'js/gallery.js' %}?v={% now 'U' %}"></script>
    <script src="{% static 'js/videos.js' %}?v={% now 'U' %}"></script>
    <script src="{% static 'js/scroll-reveal.js' %}?v={% now 'U' %}"></script>
    <script src="{% static 'js/reviews.js' %}?v={% now 'U' %}"></script>
    <script src="{% static 'js/faq.js' %}?v={% now 'U' %}"></script>
    <script src="{% static 'js/contact.js' %}?v={% now 'U' %}"></script>
</body>
</html>
